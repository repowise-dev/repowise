# Repowise CI gates for GitLab merge requests.
#
# Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/repowise-dev/repowise/main/ci/gitlab/repowise.gitlab-ci.yml
#
# Each gate is its own job, so one failing does not hide the others. The
# markdown report is printed to the job log and kept as an artifact. Doc drift
# and security also write a Code Quality report, so their findings show in the
# merge request's Code Quality widget; repowise-code-quality publishes the
# default branch's report the widget compares against. Exit codes are the
# gates': 1 failed, 2 could not evaluate; both fail the job.
#
# Variables (set them in your .gitlab-ci.yml or the project's CI settings):
#   REPOWISE_VERSION                Version to install; empty installs the latest.
#   REPOWISE_COVERAGE_REPORT        Coverage reports, space separated: paths or globs
#                                   (artifacts/**/lcov.info, expanded by Repowise), each
#                                   optionally path=prefix. The coverage job runs only
#                                   when it is set; add `needs:` on your test job.
#   REPOWISE_COVERAGE_FAIL_UNDER    Minimum patch coverage percent.
#   REPOWISE_COVERAGE_MIN_COVERABLE_LINES
#                                   Small-change tolerance: fewer changed executable
#                                   lines than this never fails the coverage gate.
#   REPOWISE_COVERAGE_FAIL_UNDER_RISKY
#                                   Minimum patch coverage percent over risky files only.
#   REPOWISE_COVERAGE_FAIL_UNDER_BRANCHES
#                                   Minimum percent of branches taken on changed lines.
#   REPOWISE_COVERAGE_BASE_REPORT   Coverage reports measured at the merge request's base
#                                   commit, space separated like REPOWISE_COVERAGE_REPORT:
#                                   project coverage and coverage outside the change.
#   REPOWISE_COVERAGE_MAX_DROP      Most project coverage may fall from the base, in points.
#   REPOWISE_DOC_DRIFT_BASELINE     Committed doc-drift baseline file.
#   REPOWISE_SECURITY_BASELINE      Committed security baseline file.
#   REPOWISE_SECURITY_FAIL_ON       Lowest severity that fails: high (default), med, low.
#   REPOWISE_RISK_FAIL_ABOVE_PERCENTILE
#                                   Fail when the change ranks above this percentile of
#                                   recent commits. The risk job runs only when it is set.

.repowise:
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python -m pip install --quiet "repowise${REPOWISE_VERSION:+==$REPOWISE_VERSION}"
    # The gates diff against the target branch, which a merge request clone lacks.
    - git fetch --quiet --no-tags origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

repowise-coverage:
  extends: .repowise
  script:
    # No shell globbing: the report list is split on spaces, and Repowise
    # expands the globs itself (so a glob matching nothing exits 2).
    - set -f
    - >
      repowise coverage check "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD"
      $(printf -- '--report %s ' $REPOWISE_COVERAGE_REPORT)
      ${REPOWISE_COVERAGE_FAIL_UNDER:+--fail-under "$REPOWISE_COVERAGE_FAIL_UNDER"}
      ${REPOWISE_COVERAGE_MIN_COVERABLE_LINES:+--min-coverable-lines "$REPOWISE_COVERAGE_MIN_COVERABLE_LINES"}
      ${REPOWISE_COVERAGE_FAIL_UNDER_RISKY:+--fail-under-risky "$REPOWISE_COVERAGE_FAIL_UNDER_RISKY"}
      ${REPOWISE_COVERAGE_FAIL_UNDER_BRANCHES:+--fail-under-branches "$REPOWISE_COVERAGE_FAIL_UNDER_BRANCHES"}
      ${REPOWISE_COVERAGE_BASE_REPORT:+$(printf -- '--base-report %s ' $REPOWISE_COVERAGE_BASE_REPORT)}
      ${REPOWISE_COVERAGE_MAX_DROP:+--max-drop "$REPOWISE_COVERAGE_MAX_DROP"}
      --format markdown > repowise-coverage.md
  after_script:
    - cat repowise-coverage.md
  artifacts:
    when: always
    paths: [repowise-coverage.md]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $REPOWISE_COVERAGE_REPORT

repowise-doc-drift:
  extends: .repowise
  script:
    # The gate runs once per format (one run writing both would halve the cost).
    # The Code Quality run goes even when the gate fails, and the job exits with
    # the gate's code. Its output is kept only when it parses as JSON, so a usage
    # error or a crash leaves `[]` rather than an invalid artifact.
    - |
      status=0
      repowise doc-drift --check \
        ${REPOWISE_DOC_DRIFT_BASELINE:+--baseline "$REPOWISE_DOC_DRIFT_BASELINE"} \
        --format markdown > repowise-doc-drift.md || status=$?
      repowise doc-drift --check \
        ${REPOWISE_DOC_DRIFT_BASELINE:+--baseline "$REPOWISE_DOC_DRIFT_BASELINE"} \
        --format gitlab > gl.tmp || true
      python -m json.tool gl.tmp > /dev/null && mv gl.tmp gl-code-quality-doc-drift.json \
        || echo '[]' > gl-code-quality-doc-drift.json
      exit "$status"
  after_script:
    - cat repowise-doc-drift.md
  artifacts:
    when: always
    paths: [repowise-doc-drift.md]
    reports:
      codequality: gl-code-quality-doc-drift.json

repowise-security:
  extends: .repowise
  script:
    # Two runs and a guarded report, as in repowise-doc-drift.
    - |
      status=0
      repowise security check "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" \
        --fail-on "${REPOWISE_SECURITY_FAIL_ON:-high}" \
        ${REPOWISE_SECURITY_BASELINE:+--baseline "$REPOWISE_SECURITY_BASELINE"} \
        --format markdown > repowise-security.md || status=$?
      repowise security check "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" \
        --fail-on "${REPOWISE_SECURITY_FAIL_ON:-high}" \
        ${REPOWISE_SECURITY_BASELINE:+--baseline "$REPOWISE_SECURITY_BASELINE"} \
        --format gitlab > gl.tmp || true
      python -m json.tool gl.tmp > /dev/null && mv gl.tmp gl-code-quality-security.json \
        || echo '[]' > gl-code-quality-security.json
      exit "$status"
  after_script:
    - cat repowise-security.md
  artifacts:
    when: always
    paths: [repowise-security.md]
    reports:
      codequality: gl-code-quality-security.json

# The Code Quality widget compares a merge request's report with the one from
# the target branch's latest pipeline, so this job publishes that one on the
# default branch. It never fails the pipeline. Only doc drift has a base report:
# security judges only what a change adds, and the default branch has no change
# to judge, so every security issue a merge request raises shows as new.
repowise-code-quality:
  image: python:3.12
  allow_failure: true
  script:
    - |
      python -m pip install --quiet "repowise${REPOWISE_VERSION:+==$REPOWISE_VERSION}"
      repowise doc-drift --check \
        ${REPOWISE_DOC_DRIFT_BASELINE:+--baseline "$REPOWISE_DOC_DRIFT_BASELINE"} \
        --format gitlab > gl.tmp || true
      python -m json.tool gl.tmp > /dev/null && mv gl.tmp gl-code-quality-doc-drift.json \
        || echo '[]' > gl-code-quality-doc-drift.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-doc-drift.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

repowise-risk:
  extends: .repowise
  script:
    - >
      repowise risk "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD"
      --fail-above-percentile "$REPOWISE_RISK_FAIL_ABOVE_PERCENTILE"
      --format markdown > repowise-risk.md
  after_script:
    - cat repowise-risk.md
  artifacts:
    when: always
    paths: [repowise-risk.md]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $REPOWISE_RISK_FAIL_ABOVE_PERCENTILE
