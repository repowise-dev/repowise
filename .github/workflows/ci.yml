name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  # A new push to a pull request replaces its run. Pushes get one group per
  # commit, so every merge finishes and uploads its coverage.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Python tests — matrix across Python 3.11, 3.12, 3.13
  # ---------------------------------------------------------------------------
  test-python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # proves the coverage upload comes from this repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --python ${{ matrix.python-version }}

      - name: Run provider tests (no API keys required)
        run: uv run pytest tests/providers/ -v --tb=short

      # One worker per core. loadfile keeps each module on one worker, so a
      # module-scoped fixture (an indexed sample repo, say) is built once, not
      # once per worker that draws a test from it.
      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: uv run pytest tests/unit/ -n auto --dist loadfile -v --tb=short --durations=25

      # One leg measures coverage for the pull request bot's checks comment.
      # sysmon (Python 3.12+) measures lines with far less overhead than the
      # tracer; it cannot record per-test contexts, which this report omits.
      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
        run: uv run --with pytest-cov pytest tests/unit/ -n auto --dist loadfile -v --tb=short --durations=25 --cov=packages --cov-report=xml --junitxml=junit.xml

      # Read by the impacted-tests-compare job below; recorded only, never fails.
      - name: Upload the test report for the selection record
        if: always() && matrix.python-version == '3.12' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: impacted-tests-junit
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: Upload coverage to Repowise
        if: always() && matrix.python-version == '3.12'
        continue-on-error: true
        env:
          REPORTS: "coverage.xml"
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s globstar nullglob
          files=()
          for pattern in $REPORTS; do for f in $pattern; do [ -f "$f" ] && files+=(-F "report=@$f"); done; done
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::Repowise: no coverage report found at: $REPORTS"; exit 0; fi
          auth=()
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repowise" | jq -r '.value // empty' || true)
            [ -n "$token" ] && auth=(-H "Authorization: Bearer $token")
          fi
          curl -sS --fail-with-body --max-time 60 "${auth[@]}" "${files[@]}" \
            -F "repository=$GITHUB_REPOSITORY" -F "head_sha=$HEAD_SHA" -F "pr_number=$PR_NUMBER" \
            -F "event=$GITHUB_EVENT_NAME" -F "run_url=$RUN_URL" -F "workspace=$GITHUB_WORKSPACE" \
            https://api.repowise.dev/ci/coverage \
            || echo "::warning::Repowise: coverage upload failed; see the message above."

  # ---------------------------------------------------------------------------
  # Test selection, recorded only. Every test above still runs; these jobs note
  # which tests `repowise impacted-tests` would have picked and whether a
  # failing test fell outside them. They run beside the tests, not before them,
  # and every step continues on error, so none of them can fail a run.
  # ---------------------------------------------------------------------------
  repowise-index:
    name: Repowise index (main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read
      actions: write   # deletes older index caches; main pushes only

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        continue-on-error: true
        timeout-minutes: 15
        run: uv sync --all-packages

      # The newest earlier index, brought up to this commit.
      - name: Restore the previous index
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .repowise
          key: repowise-index-${{ github.sha }}
          restore-keys: repowise-index-

      - name: Build the index
        id: build
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f .repowise/state.json ]; then
            uv run repowise update --index-only
          else
            uv run repowise init --yes --no-prose --no-editor-setup --no-hook
          fi

      - name: Save the index
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .repowise
          key: repowise-index-${{ github.sha }}

      # Keep the three newest indexes so they never evict the dependency
      # caches the test jobs restore.
      - name: Delete older indexes
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key repowise-index- --sort created_at --order desc --limit 100 \
            --json key --jq '.[].key' | tail -n +4 | xargs -r -n1 gh cache delete || true

  impacted-tests-shadow:
    name: Test selection (recorded only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        continue-on-error: true
        timeout-minutes: 15
        run: uv sync --all-packages

      # A pull request checks out its merge commit, whose first parent is the
      # target branch; on main the first parent is the previous commit. Either
      # way it is the base the tests ran against.
      - name: Find the base
        id: base
        continue-on-error: true
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      # Read-only: pull requests, forks included, restore main's index and
      # never save one. An older index is used as is.
      - name: Restore the main index
        id: index
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .repowise
          key: repowise-index-${{ steps.base.outputs.sha }}
          restore-keys: repowise-index-

      - name: Select tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          BASE: ${{ steps.base.outputs.sha }}
          CACHE_HIT: ${{ steps.index.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.index.outputs.cache-matched-key }}
          PYTHONUTF8: "1"
        run: |
          mkdir -p shadow
          SECONDS=0
          code=0
          uv run repowise impacted-tests "$BASE...HEAD" --format json --runner pytest --prioritize \
            > shadow/selection.json 2> shadow/selection.log || code=$?
          seconds=$SECONDS
          cache=none
          if [ "$CACHE_HIT" = "true" ]; then cache=exact; elif [ -n "$CACHE_KEY" ]; then cache=older; fi
          printf '{"base": "%s", "selector_exit": %d, "selector_seconds": %d, "index_cache": "%s"}\n' \
            "$BASE" "$code" "$seconds" "$cache" > shadow/selector.json
          tail -n 20 shadow/selection.log
          exit 0

      - name: Upload the selection
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: impacted-tests-selection
          path: shadow/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  impacted-tests-compare:
    name: Test selection compared (recorded only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [impacted-tests-shadow, test-python]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      # The script needs only the standard library and the shared CI helpers.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: |
            scripts
            packages/core/src/repowise/core/ci

      - name: Download the selection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: impacted-tests-selection
          path: shadow

      - name: Download the test report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: impacted-tests-junit
          path: shadow

      - name: Compare
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONPATH: packages/core/src
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/impacted_tests_shadow.py --selection shadow/selection.json \
            --meta shadow/selector.json --junit shadow/junit.xml --out shadow/record.json \
            || echo "Test selection comparison could not run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: impacted-tests-record
          path: shadow/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  # ---------------------------------------------------------------------------
  # tree-sitter floor — installs the declared minimum tree-sitter version and
  # compiles every language's query against it. `uv sync` alone always
  # resolves the newest tree-sitter, which is why #2165 (13 of 27 language
  # queries failing to compile against tree-sitter 0.23.x/0.24.x, with each
  # failure silently indexing the language at zero symbols) went uncaught.
  # Deliberately narrow: only tree-sitter itself is pinned down to the floor,
  # not `--resolution lowest-direct` for the whole dependency set, which
  # would fail on unrelated loose floors elsewhere in this repo.
  # ---------------------------------------------------------------------------
  test-tree-sitter-floor:
    name: tree-sitter floor (query compilation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Pin tree-sitter to the declared floor
        run: uv pip install "tree-sitter==0.25.0"

      - name: Run query-compilation test
        # --no-sync: plain `uv run` re-syncs the venv from uv.lock before
        # running, which would silently reinstall the newest tree-sitter and
        # undo the pin above.
        run: uv run --no-sync pytest tests/unit/ingestion/parser/test_query_compilation.py -v --tb=short

  # ---------------------------------------------------------------------------
  # Python lint — ruff. Deliberately its own job rather than a step inside the
  # test matrix: the result is identical on 3.11/3.12/3.13 (target-version is
  # pinned in pyproject.toml), so running it there would burn three runners to
  # learn one thing, and a lint failure would masquerade as a test failure.
  # ---------------------------------------------------------------------------
  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff
        run: uv run ruff check .

  # ---------------------------------------------------------------------------
  # Documentation drift over the checkout, no index; the baseline says what it holds.
  # ---------------------------------------------------------------------------
  doc-drift:
    name: Documentation drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Check documentation drift
        run: uv run repowise doc-drift --check --baseline .github/doc-drift-baseline.json --format github

  # ---------------------------------------------------------------------------
  # Integration tests (run on push to main only, slower)
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Web UI — lint and type check
  # ---------------------------------------------------------------------------
  test-web:
    name: Web UI lint + type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check --workspace packages/web

      - name: Lint
        run: npm run lint --workspace packages/web

      - name: Lint shared packages (no framework imports)
        run: npm run lint:shared

      - name: Type check api-client
        run: npm run type-check --workspace @repowise-dev/api-client

      - name: Test api-client
        run: npm run test --workspace @repowise-dev/api-client

      # Compiles the generated HTTP contract too, which nothing else imports yet.
      - name: Type check types
        run: npm run type-check --workspace @repowise-dev/types

      - name: Test types
        run: npm run test --workspace @repowise-dev/types

      - name: Test ui
        run: npm run test --workspace @repowise-dev/ui

      # ICU compile gate: a malformed plural or stray brace in any catalog
      # fails the build here instead of throwing on the page that renders it.
      - name: Check message catalogs compile (ICU)
        run: npm run i18n:icu --workspace packages/web

      # Usage gate: a key a `t("...")` call asks for that `en.json` does not
      # define renders the raw key path (or throws MISSING_MESSAGE), and key
      # parity cannot see it — it compares key sets, not call sites. Structural
      # error, so it fails the build.
      - name: Check every used message key resolves
        run: npm run i18n:usage --workspace packages/web

      # Catalog freshness only warns: English is the source of truth, so a key
      # a locale has not reached yet still renders English at runtime. The step
      # must not fail the build (the script itself exits 0 either way).
      - name: Report catalog key gaps (warn only)
        run: npm run i18n:check --workspace packages/web
        continue-on-error: true

      - name: Type check claude-mod
        run: npm run type-check --workspace @repowise-dev/claude-mod

      - name: Test claude-mod
        run: npm run test --workspace @repowise-dev/claude-mod

      - name: Check the committed Lens bundle is current
        run: npm run build:mod --workspace @repowise-dev/claude-mod -- --check

  # ---------------------------------------------------------------------------
  # VS Code extension — type check, bundle-size gate, and Electron smoke test
  # ---------------------------------------------------------------------------
  test-vscode:
    name: VS Code extension test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check --workspace packages/vscode

      - name: Build (asserts bundle size budget)
        run: npm run build --workspace packages/vscode

      - name: Build webviews (reports chunk sizes)
        run: npm run build:webview --workspace packages/vscode

      - name: Webview unit tests
        run: npm run test:webview --workspace packages/vscode

      - name: Smoke test under a virtual display
        run: xvfb-run -a npm run test --workspace packages/vscode

      - name: Package VSIX (no login required)
        run: npm run package --workspace packages/vscode

  # ---------------------------------------------------------------------------
  # Structurizr DSL — parse the emitter's output with the real parser.
  #
  # The unit tests can prove our own invariants (braces balance, no dangling
  # references, stable identifiers) but not that the result is valid
  # Structurizr; only Structurizr's parser knows that. Silently invalid DSL is
  # the one failure mode users would notice before we did.
  #
  # Path-gated because it pulls a ~300MB image: it runs when the emitter or the
  # sample changes, not on every PR.
  # ---------------------------------------------------------------------------
  structurizr-dsl:
    name: Structurizr DSL parses
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Check whether the emitter changed
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            emitter:
              - 'packages/server/src/repowise/server/services/c4_builder/**'
              # Every C4 id is rendered through this, so a change here changes
              # every identifier in the emitted file.
              - 'packages/core/src/repowise/core/ids.py'
              - 'scripts/emit_sample_dsl.py'
              - 'tests/unit/server/test_structurizr_export.py'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changed.outputs.emitter == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        if: steps.changed.outputs.emitter == 'true'
        run: uv sync --all-packages

      - name: Emit a sample workspace and fragment
        if: steps.changed.outputs.emitter == 'true'
        run: uv run python scripts/emit_sample_dsl.py dsl-sample

      - name: Validate the standalone workspace
        if: steps.changed.outputs.emitter == 'true'
        run: |
          docker run --rm -v "$PWD/dsl-sample:/work" \
            structurizr/structurizr:latest validate -workspace /work/workspace.dsl

      - name: Validate the fragment via a host workspace
        if: steps.changed.outputs.emitter == 'true'
        run: |
          docker run --rm -v "$PWD/dsl-sample/fragment:/work" \
            structurizr/structurizr:latest validate -workspace /work/workspace.dsl

      - name: Render every view
        if: steps.changed.outputs.emitter == 'true'
        run: |
          # The image runs as uid 65532, which cannot write into a checkout
          # owned by the runner. Give the render its own world-writable
          # directory rather than letting it write beside the DSL.
          mkdir -m 777 dsl-sample/rendered
          docker run --rm -v "$PWD/dsl-sample:/work" \
            structurizr/structurizr:latest export -workspace /work/workspace.dsl \
            -format mermaid -output /work/rendered
          # An exporter that wrote nothing also exits 0.
          test "$(find dsl-sample/rendered -name '*.mmd' | wc -l)" -gt 0
